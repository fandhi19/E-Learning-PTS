<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurnal & Presensi Kelas - RuangInformatika</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                dark: "#0a0a0a",
                card: "#121212",
                border: "#222222",
                neon: "#00e676",
                neonHover: "#00c853",
              },
            },
          },
        },
      };
    </script>
    <!-- Bootstrap Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #222222;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00e676;
      }
    </style>
  </head>
  <body class="bg-brand-dark text-slate-100 min-h-screen p-4 md:p-6 antialiased">
    <div class="max-w-7xl mx-auto space-y-6">
      <!-- Top Navigation & Header -->
      <header class="bg-brand-card border border-brand-border rounded-2xl p-4 md:p-6 flex flex-wrap items-center justify-between gap-4 shadow-2xl backdrop-blur-md">
        <div class="flex items-center gap-4">
          <div class="p-3 bg-brand-neon/10 text-brand-neon rounded-xl border border-brand-neon/20 flex items-center justify-center">
            <i class="bi bi-calendar-check-fill text-2xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">Jurnal & Presensi Kelas</h1>
            <span class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5" id="syncStatus"> <i class="bi bi-cloud-check text-brand-neon"></i> Terhubung ke Google Sheets </span>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="fetchAttendanceFromSheet()" class="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition flex items-center gap-2">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
          <a href="index.html" class="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition flex items-center gap-2">
            <i class="bi bi-trophy"></i> Leaderboard
          </a>
          <button onclick="openNewSessionModal()" class="px-4 py-2 text-sm font-bold bg-brand-neon text-black hover:bg-brand-neonHover rounded-xl transition shadow-lg shadow-brand-neon/20 flex items-center gap-2">
            <i class="bi bi-plus-circle-fill"></i> Pertemuan Baru
          </button>
        </div>
      </header>

      <!-- Main Layout Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Sidebar Riwayat Pertemuan -->
        <aside class="lg:col-span-4 bg-brand-card border border-brand-border rounded-2xl p-5 shadow-xl flex flex-col h-fit">
          <h2 class="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2"><i class="bi bi-clock-history text-brand-neon"></i> Riwayat Pertemuan</h2>
          <div class="space-y-2 max-h-[600px] overflow-y-auto pr-1" id="sessionList">
            <div class="text-slate-400 text-center py-8 text-sm">
              <i class="bi bi-arrow-repeat animate-spin text-brand-neon text-xl block mb-2"></i>
              Memuat riwayat...
            </div>
          </div>
        </aside>

        <!-- Detail Absensi Panel -->
        <main class="lg:col-span-8 bg-brand-card border border-brand-border rounded-2xl p-5 shadow-xl" id="attendanceDetailPanel">
          <div class="text-center text-slate-500 py-16">
            <i class="bi bi-calendar-event text-5xl opacity-40 block mb-3"></i>
            <p class="text-sm">Pilih atau buat tanggal pertemuan baru di sebelah kiri untuk mengisi presensi.</p>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Tambah Pertemuan Baru -->
    <div id="sessionModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-brand-card border border-brand-border text-white w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
        <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-4">
          <h3 class="font-bold text-lg flex items-center gap-2"><i class="bi bi-calendar-plus text-brand-neon"></i> Buat Pertemuan Baru</h3>
          <button onclick="closeNewSessionModal()" class="text-slate-400 hover:text-white text-lg"><i class="bi bi-x-lg"></i></button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Tanggal Pertemuan</label>
            <input type="date" id="sessionDate" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand-neon transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Materi / Catatan Pertemuan</label>
            <input
              type="text"
              id="sessionNote"
              placeholder="Contoh: Pertemuan 1 - Pengenalan Algoritma"
              class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-neon transition"
            />
          </div>
          <button onclick="saveNewSession()" class="w-full py-3 bg-brand-neon text-black font-bold text-sm rounded-xl hover:bg-brand-neonHover transition shadow-lg shadow-brand-neon/20 mt-2">Mulai Presensi</button>
        </div>
      </div>
    </div>

    <script>
      const GOOGLE_SCRIPT_ABSEN_URL = "https://script.google.com/macros/s/AKfycbzNyFk7rOY04V8XH9XFpzCBdl20ATybRnf_ToXN1eEMkP-cbtOazjx2hJizhRvl5SLD5w/exec";

      const sampleNames = [
        "Ainun Risky",
        "Alexander Modegliano Biwada",
        "Arindia Maharani",
        "Aufa Tazkia Rahmadani",
        "Cornelia Dwi Arini Puspaningrum",
        "Dzaki Hammam Ibrahim",
        "Elena Putri Nareswari",
        "Fatima Ahzahra",
        "Freya Gracia",
        "Gabriel Alvaro Anindito",
        "Gabriella Braveadonia Valga",
        "Hubertus Radhitya Melvin",
        "Isabel Ada Lamont",
        "Julio Kevin Nugroho",
        "Justien Pratama Setiawan",
        "Kesya Hanifah Ufairah",
        "Kristoforus Arsenio Reswara",
        "Kumala Devi Andini Setiawan",
        "Leonardus Evan Syandana Rama",
        "Lintang Nareswara",
        "Maria Felicia Nindya Danastri",
        "Maria Kimiko Ruby Renggawan",
        "Maria Lethicia Viona",
        "Muhammad Suttan Fahrezy",
        "Nadia Az-Zahra",
        "Narayan itendralay Isyunanto",
        "Ozzie Mahardika Prabaswara",
        "Penta Kusuma",
        "Queen Callysta Eleana",
        "Queen Gabriella Ginoga",
        "Rafi Ardan Saputra",
        "Raihanah Lembayung Indah",
        "Rayhan Evan Sachio",
        "Tiara Febriana",
        "Tsabita Neysa Azalia",
        "Yunita Putri Prasetiya",
      ];

      let attendanceData = [];
      let activeSessionId = null;

      document.getElementById("sessionDate").valueAsDate = new Date();

      async function fetchAttendanceFromSheet() {
        const syncStatus = document.getElementById("syncStatus");
        syncStatus.innerHTML = `<i class="bi bi-arrow-repeat text-amber-400 animate-spin"></i> Menyinkronkan...`;

        try {
          const res = await fetch(GOOGLE_SCRIPT_ABSEN_URL);
          const data = await res.json();
          attendanceData = Array.isArray(data) ? data : [];
          syncStatus.innerHTML = `<i class="bi bi-cloud-check text-brand-neon"></i> Terhubung ke Google Sheets`;
        } catch (err) {
          console.error("Gagal mengambil data absensi:", err);
          syncStatus.innerHTML = `<i class="bi bi-exclamation-triangle text-rose-500"></i> Gagal Sinkronisasi`;
        } finally {
          renderSessionList();
          if (attendanceData.length > 0) {
            if (!activeSessionId || !attendanceData.find((s) => s.id === activeSessionId)) {
              selectSession(attendanceData[0].id);
            } else {
              selectSession(activeSessionId);
            }
          } else {
            document.getElementById("attendanceDetailPanel").innerHTML = `
            <div class="text-center text-slate-500 py-16">
              <i class="bi bi-calendar-event text-5xl opacity-40 block mb-3"></i>
              <p class="text-sm">Pilih atau buat tanggal pertemuan baru di sebelah kiri untuk mengisi presensi.</p>
            </div>`;
          }
        }
      }

      async function syncToSheet() {
        const syncStatus = document.getElementById("syncStatus");
        syncStatus.innerHTML = `<i class="bi bi-arrow-repeat text-amber-400 animate-spin"></i> Menyimpan...`;

        try {
          await fetch(GOOGLE_SCRIPT_ABSEN_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(attendanceData),
          });
          syncStatus.innerHTML = `<i class="bi bi-cloud-check text-brand-neon"></i> Tersimpan ke Google Sheets`;
        } catch (err) {
          console.error("Gagal menyinkronkan absensi:", err);
          syncStatus.innerHTML = `<i class="bi bi-exclamation-triangle text-rose-500"></i> Gagal Menyimpan`;
        }
      }

      function openNewSessionModal() {
        document.getElementById("sessionModal").classList.remove("hidden");
      }

      function closeNewSessionModal() {
        document.getElementById("sessionModal").classList.add("hidden");
      }

      async function saveNewSession() {
        const dateVal = document.getElementById("sessionDate").value;
        const noteVal = document.getElementById("sessionNote").value || "Pertemuan Rutin";

        if (!dateVal) {
          alert("Harap pilih tanggal pertemuan!");
          return;
        }

        const newSession = {
          id: Date.now(),
          date: dateVal,
          note: noteVal,
          records: sampleNames.map((name, idx) => ({
            id: idx + 1,
            name: name,
            status: "",
          })),
        };

        attendanceData.unshift(newSession);
        closeNewSessionModal();
        renderSessionList();
        selectSession(newSession.id);
        await syncToSheet();
      }

      function renderSessionList() {
        const container = document.getElementById("sessionList");
        if (attendanceData.length === 0) {
          container.innerHTML = `<div class="text-slate-500 text-xs text-center py-6">Belum ada riwayat pertemuan.</div>`;
          return;
        }

        container.innerHTML = "";
        attendanceData.forEach((session) => {
          const isActive = session.id === activeSessionId;
          const formattedDate = new Date(session.date).toLocaleDateString("id-ID", {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
          });

          const activeClass = isActive ? "bg-brand-neon/10 border-brand-neon text-white" : "bg-black/30 border-white/5 text-slate-300 hover:bg-white/5 hover:border-white/10";

          container.innerHTML += `
          <button onclick="selectSession(${session.id})" class="w-full text-left p-3 rounded-xl border transition flex items-center justify-between ${activeClass}">
            <div class="truncate pr-2">
              <div class="font-bold text-sm ${isActive ? "text-brand-neon" : "text-white"}">${formattedDate}</div>
              <div class="text-xs text-slate-400 truncate mt-0.5">${session.note}</div>
            </div>
            <i class="bi bi-chevron-right text-xs text-slate-500"></i>
          </button>`;
        });
      }

      function selectSession(id) {
        activeSessionId = id;
        renderSessionList();

        const session = attendanceData.find((s) => s.id === id);
        if (!session) return;

        const formattedDate = new Date(session.date).toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });

        const counts = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, Belum: 0 };
        session.records.forEach((r) => {
          if (counts[r.status] !== undefined) counts[r.status]++;
          else counts.Belum++;
        });

        const detailPanel = document.getElementById("attendanceDetailPanel");

        let rowsHTML = session.records
          .map(
            (student, idx) => `
        <tr class="border-b border-white/5 hover:bg-white/[0.02] transition">
          <td class="py-3 px-3 text-xs text-slate-500 font-mono">${idx + 1}</td>
          <td class="py-3 px-3 text-sm font-medium text-white">${student.name}</td>
          <td class="py-3 px-3 text-right">
            <div class="inline-flex rounded-lg bg-black/40 p-1 border border-white/10 gap-1">
              <button onclick="updateStudentStatus(${student.id}, 'Hadir')" class="px-2.5 py-1 text-xs font-semibold rounded-md transition ${student.status === "Hadir" ? "bg-emerald-500 text-black shadow" : "text-slate-400 hover:text-white"}">Hadir</button>
              <button onclick="updateStudentStatus(${student.id}, 'Izin')" class="px-2.5 py-1 text-xs font-semibold rounded-md transition ${student.status === "Izin" ? "bg-amber-400 text-black shadow" : "text-slate-400 hover:text-white"}">Izin</button>
              <button onclick="updateStudentStatus(${student.id}, 'Sakit')" class="px-2.5 py-1 text-xs font-semibold rounded-md transition ${student.status === "Sakit" ? "bg-sky-400 text-black shadow" : "text-slate-400 hover:text-white"}">Sakit</button>
              <button onclick="updateStudentStatus(${student.id}, 'Alpa')" class="px-2.5 py-1 text-xs font-semibold rounded-md transition ${student.status === "Alpa" ? "bg-rose-500 text-white shadow" : "text-slate-400 hover:text-white"}">Alpa</button>
            </div>
          </td>
        </tr>`,
          )
          .join("");

        detailPanel.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-5 border-b border-white/10">
          <div>
            <h3 class="text-lg font-bold text-white">${formattedDate}</h3>
            <span class="text-xs font-semibold text-brand-neon">${session.note}</span>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="markAllPresent()" class="px-3 py-1.5 text-xs font-semibold text-brand-neon border border-brand-neon/30 bg-brand-neon/10 hover:bg-brand-neon/20 rounded-lg transition flex items-center gap-1.5">
              <i class="bi bi-check-all"></i> Semua Hadir
            </button>
            <button onclick="copySummaryText()" class="px-3 py-1.5 text-xs font-semibold text-sky-400 border border-sky-400/30 bg-sky-400/10 hover:bg-sky-400/20 rounded-lg transition flex items-center gap-1.5">
              <i class="bi bi-share"></i> Salin Rekap
            </button>
            <button onclick="deleteSession(${session.id})" class="px-3 py-1.5 text-xs font-semibold text-rose-400 border border-rose-400/30 bg-rose-400/10 hover:bg-rose-400/20 rounded-lg transition">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-6">
          <div class="bg-black/40 border border-emerald-500/20 p-2.5 rounded-xl text-center">
            <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Hadir</div>
            <div class="text-xl font-extrabold text-white mt-0.5">${counts.Hadir}</div>
          </div>
          <div class="bg-black/40 border border-amber-500/20 p-2.5 rounded-xl text-center">
            <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">Izin</div>
            <div class="text-xl font-extrabold text-white mt-0.5">${counts.Izin}</div>
          </div>
          <div class="bg-black/40 border border-sky-500/20 p-2.5 rounded-xl text-center">
            <div class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">Sakit</div>
            <div class="text-xl font-extrabold text-white mt-0.5">${counts.Sakit}</div>
          </div>
          <div class="bg-black/40 border border-rose-500/20 p-2.5 rounded-xl text-center">
            <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Alpa</div>
            <div class="text-xl font-extrabold text-white mt-0.5">${counts.Alpa}</div>
          </div>
          <div class="bg-black/40 border border-white/10 p-2.5 rounded-xl text-center col-span-2 sm:col-span-1">
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Belum</div>
            <div class="text-xl font-extrabold text-white mt-0.5">${counts.Belum}</div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-white/10 text-xs text-slate-400 uppercase tracking-wider">
                <th class="py-2.5 px-3 w-12">No</th>
                <th class="py-2.5 px-3">Nama Murid</th>
                <th class="py-2.5 px-3 text-right">Status Kehadiran</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHTML}
            </tbody>
          </table>
        </div>`;
      }

      async function updateStudentStatus(studentId, newStatus) {
        const session = attendanceData.find((s) => s.id === activeSessionId);
        if (session) {
          const student = session.records.find((r) => r.id === studentId);
          if (student) {
            student.status = newStatus;
            selectSession(activeSessionId);
            await syncToSheet();
          }
        }
      }

      async function markAllPresent() {
        const session = attendanceData.find((s) => s.id === activeSessionId);
        if (session) {
          session.records.forEach((r) => {
            if (!r.status) r.status = "Hadir";
          });
          selectSession(activeSessionId);
          await syncToSheet();
        }
      }

      function copySummaryText() {
        const session = attendanceData.find((s) => s.id === activeSessionId);
        if (!session) return;

        const formattedDate = new Date(session.date).toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });

        const counts = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, Belum: 0 };
        const nonHadirList = [];

        session.records.forEach((r) => {
          if (r.status === "Hadir") counts.Hadir++;
          else if (r.status === "Izin") {
            counts.Izin++;
            nonHadirList.push(`- ${r.name} (Izin)`);
          } else if (r.status === "Sakit") {
            counts.Sakit++;
            nonHadirList.push(`- ${r.name} (Sakit)`);
          } else if (r.status === "Alpa") {
            counts.Alpa++;
            nonHadirList.push(`- ${r.name} (Alpa)`);
          } else {
            counts.Belum++;
          }
        });

        let text = `*REKAP PRESENSI KELAS*\n`;
        text += `Tanggal: ${formattedDate}\n`;
        text += `Materi: ${session.note}\n\n`;
        text += `*Ringkasan:*\n`;
        text += `✅ Hadir: ${counts.Hadir}\n`;
        text += `🟡 Izin: ${counts.Izin}\n`;
        text += `🔵 Sakit: ${counts.Sakit}\n`;
        text += `🔴 Alpa: ${counts.Alpa}\n`;
        if (counts.Belum > 0) text += `⚪ Belum Diabsen: ${counts.Belum}\n`;

        if (nonHadirList.length > 0) {
          text += `\n*Daftar Siswa Tidak Hadir:*\n` + nonHadirList.join("\n");
        }

        navigator.clipboard.writeText(text).then(() => {
          alert("Rekap absensi berhasil disalin ke clipboard! Siap ditempel ke WhatsApp.");
        });
      }

      async function deleteSession(id) {
        if (confirm("Yakin ingin menghapus jurnal & presensi tanggal ini?")) {
          attendanceData = attendanceData.filter((s) => s.id !== id);
          activeSessionId = null;
          renderSessionList();
          document.getElementById("attendanceDetailPanel").innerHTML = `
          <div class="text-center text-slate-500 py-16">
            <i class="bi bi-calendar-event text-5xl opacity-40 block mb-3"></i>
            <p class="text-sm">Pilih atau buat tanggal pertemuan baru di sebelah kiri untuk mengisi presensi.</p>
          </div>`;
          await syncToSheet();
        }
      }

      fetchAttendanceFromSheet();
    </script>
  </body>
</html>
